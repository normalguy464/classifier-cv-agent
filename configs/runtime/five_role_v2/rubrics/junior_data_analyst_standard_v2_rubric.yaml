artifact_kind: scoring_rubric
rubric_id: da-std-rubric-v2
rubric_version: 2.0.1
contract_status: approved_for_runtime
job_profile_id: junior-data-analyst-std-v2
score_scale: {minimum: 0, maximum: 100}
criteria:
  - criterion_id: mandatory-requirements
    title: Yêu cầu bắt buộc
    weight: 30
    description: Đối chiếu riêng từng yêu cầu bắt buộc và phân biệt đạt, không đạt, thiếu và mâu thuẫn.
    evaluation_signals:
      - Thông tin thực hành trực tiếp cho từng yêu cầu bắt buộc.
      - Phân biệt satisfied, unsatisfied, missing và conflicting.
      - Không dùng yêu cầu ưu tiên để thay thế yêu cầu bắt buộc.
    missing_evidence_handling: Thiếu hoặc mâu thuẫn ở bất kỳ yêu cầu bắt buộc nào phải kích hoạt Needs Review.
  - criterion_id: da-technical-specialization
    title: Năng lực kỹ thuật chuyên môn
    weight: 25
    description: Đánh giá SQL trung cấp, Python hoặc R, BI, làm sạch, đối soát và khả năng tái tạo phân tích.
    evaluation_signals:
      - SQL có JOIN, CTE, window function hoặc kiểm tra chất lượng dữ liệu.
      - Python hoặc R có làm sạch, biến đổi và phân tích trong ngữ cảnh cụ thể.
      - Dashboard có data model, định nghĩa KPI và luồng refresh hợp lý.
    missing_evidence_handling: Không suy diễn mức thành thạo chỉ từ danh sách công cụ.
  - criterion_id: da-role-capability
    title: Năng lực theo vai trò
    weight: 20
    description: Đánh giá cách chuyển câu hỏi nghiệp vụ thành KPI, phân tích nguyên nhân, khuyến nghị và giới hạn.
    evaluation_signals:
      - Mục tiêu và câu hỏi nghiệp vụ được xác định rõ.
      - Cách kiểm tra dữ liệu, chọn chỉ số và diễn giải kết quả hợp lý.
      - Khuyến nghị gắn với kết quả và nêu được giới hạn.
    missing_evidence_handling: Không tự bổ sung mục tiêu hoặc kết luận mà CV không nêu.
  - criterion_id: projects-and-impact
    title: Dự án, thực tập và tác động
    weight: 15
    description: Đánh giá phạm vi đóng góp, khả năng tái tạo đầu ra và tác động phù hợp cấp junior.
    evaluation_signals:
      - Vai trò, dữ liệu, phương pháp và đầu ra được nêu rõ.
      - Có sản phẩm kiểm tra được như SQL, notebook, dashboard hoặc báo cáo.
      - Tác động định lượng hoặc định tính phù hợp với thông tin đã trình bày.
    missing_evidence_handling: Không bịa quy mô hoặc tác động chưa được CV xác nhận.
  - criterion_id: communication-and-evidence-quality
    title: Độ rõ ràng và khả năng kiểm tra của thông tin trong CV
    weight: 10
    description: Đánh giá mức rõ ràng, nhất quán, khả năng kiểm tra và giới hạn được ứng viên trình bày.
    evaluation_signals:
      - Thông tin dự án mạch lạc và nhất quán giữa các phần.
      - Có chi tiết kỹ thuật, đầu ra hoặc liên kết có thể kiểm tra.
      - Phân biệt rõ đóng góp cá nhân, giả định và giới hạn.
    missing_evidence_handling: Thông tin khó kiểm tra làm giảm điểm tiêu chí này nhưng không tự tạo unsatisfied.
critical_requirement_ids: [da-sql, da-analysis-language, da-bi-reporting, da-business-analysis]
