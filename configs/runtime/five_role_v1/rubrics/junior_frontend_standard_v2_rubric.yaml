artifact_kind: scoring_rubric
rubric_id: fe-std-rubric-v2
rubric_version: 2.0.1
contract_status: approved_for_runtime
job_profile_id: junior-frontend-std-v2
score_scale: {minimum: 0, maximum: 100}
criteria:
  - criterion_id: mandatory-requirements
    title: Yêu cầu bắt buộc
    weight: 30
    description: Đối chiếu riêng từng yêu cầu bắt buộc và phân biệt đạt, không đạt, thiếu và mâu thuẫn.
    evaluation_signals:
      - Thông tin thực hành trực tiếp cho từng yêu cầu bắt buộc.
      - Phân biệt satisfied, unsatisfied, missing và conflicting.
      - Thông tin phủ định chỉ ảnh hưởng đúng năng lực được gọi tên.
    missing_evidence_handling: Thiếu hoặc mâu thuẫn ở bất kỳ yêu cầu bắt buộc nào phải kích hoạt Needs Review.
  - criterion_id: fe-technical-specialization
    title: Năng lực kỹ thuật chuyên môn
    weight: 25
    description: Đánh giá HTML, CSS, JavaScript, TypeScript, React, kiểm thử và chất lượng component.
    evaluation_signals:
      - Có semantic HTML, CSS responsive và accessibility.
      - JavaScript hoặc TypeScript và React được dùng trong ngữ cảnh cụ thể.
      - Component test hoặc user-flow test bao phủ trạng thái biên.
    missing_evidence_handling: Không suy diễn kỹ năng chỉ từ tên thư viện hoặc framework.
  - criterion_id: fe-role-capability
    title: Năng lực theo vai trò
    weight: 20
    description: Đánh giá responsive, accessibility, API, authentication, state, performance và xử lý lỗi.
    evaluation_signals:
      - Tích hợp API có loading, error, empty và xác thực.
      - State và ranh giới component phù hợp với phạm vi.
      - Có xem xét accessibility hoặc performance khi CV nêu.
    missing_evidence_handling: Không tự bổ sung hành vi giao diện hoặc số đo performance.
  - criterion_id: projects-and-impact
    title: Dự án, thực tập và tác động
    weight: 15
    description: Đánh giá phạm vi đóng góp, khả năng tái tạo đầu ra và tác động phù hợp cấp junior.
    evaluation_signals:
      - Vai trò, luồng người dùng và component do ứng viên thực hiện được nêu rõ.
      - Có bản build, repository, test hoặc preview kiểm tra được.
      - Tác động phù hợp với phạm vi dự án.
    missing_evidence_handling: Không bịa quy mô người dùng hoặc tác động chưa được xác nhận.
  - criterion_id: communication-and-evidence-quality
    title: Độ rõ ràng và khả năng kiểm tra của thông tin trong CV
    weight: 10
    description: Đánh giá mức rõ ràng, nhất quán, khả năng kiểm tra và giới hạn được ứng viên trình bày.
    evaluation_signals:
      - Mô tả luồng người dùng và quyết định UI mạch lạc.
      - Có liên kết hoặc chi tiết kỹ thuật kiểm tra được.
      - Phân biệt rõ đóng góp cá nhân và giới hạn accessibility hoặc performance.
    missing_evidence_handling: Thông tin khó kiểm tra làm giảm điểm tiêu chí này nhưng không tự tạo unsatisfied.
critical_requirement_ids: [fe-web-foundations, fe-language, fe-framework, fe-api, fe-testing-workflow]
