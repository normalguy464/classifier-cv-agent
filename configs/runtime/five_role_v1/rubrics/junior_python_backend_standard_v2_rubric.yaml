artifact_kind: scoring_rubric
rubric_id: be-std-rubric-v2
rubric_version: 2.0.1
contract_status: approved_for_runtime
job_profile_id: junior-python-backend-std-v2
score_scale: {minimum: 0, maximum: 100}
criteria:
  - criterion_id: mandatory-requirements
    title: Yêu cầu bắt buộc
    weight: 30
    description: Đối chiếu riêng từng yêu cầu bắt buộc và phân biệt đạt, không đạt, thiếu và mâu thuẫn.
    evaluation_signals:
      - Thông tin thực hành trực tiếp cho từng yêu cầu bắt buộc.
      - Phân biệt satisfied, unsatisfied, missing và conflicting.
      - Không dùng framework hoặc công cụ liên quan để suy diễn kỹ năng chưa được nêu.
    missing_evidence_handling: Thiếu hoặc mâu thuẫn ở bất kỳ yêu cầu bắt buộc nào phải kích hoạt Needs Review.
  - criterion_id: be-technical-specialization
    title: Năng lực kỹ thuật chuyên môn
    weight: 25
    description: Đánh giá Python, framework, cấu trúc dịch vụ, dependency management, kiểm thử và khả năng chạy lặp lại.
    evaluation_signals:
      - Python có module, type hints, validation và exception handling.
      - API có phân lớp, hợp đồng dữ liệu và xử lý lỗi.
      - Unit test, integration test và môi trường container được mô tả cụ thể.
    missing_evidence_handling: Không suy diễn chất lượng triển khai chỉ từ tên framework.
  - criterion_id: be-role-capability
    title: Năng lực theo vai trò
    weight: 20
    description: Đánh giá thiết kế API, schema quan hệ, transaction, validation, xác thực và quan sát lỗi.
    evaluation_signals:
      - Thiết kế endpoint, status code, pagination và OpenAPI hợp lý.
      - Schema, constraint, migration, transaction và index có ngữ cảnh.
      - Có xác thực, logging hoặc cách xử lý lỗi tích hợp cơ bản.
    missing_evidence_handling: Không bịa lưu lượng, kiến trúc hoặc độ ổn định chưa được CV nêu.
  - criterion_id: projects-and-impact
    title: Dự án, thực tập và tác động
    weight: 15
    description: Đánh giá phạm vi đóng góp, khả năng tái tạo đầu ra và tác động phù hợp cấp junior.
    evaluation_signals:
      - Vai trò, module hoặc endpoint do ứng viên thực hiện được nêu rõ.
      - Có repository, OpenAPI, test hoặc hướng dẫn chạy có thể kiểm tra.
      - Tác động kỹ thuật phù hợp với phạm vi dự án.
    missing_evidence_handling: Không bịa quy mô hệ thống hoặc tác động chưa được xác nhận.
  - criterion_id: communication-and-evidence-quality
    title: Độ rõ ràng và khả năng kiểm tra của thông tin trong CV
    weight: 10
    description: Đánh giá mức rõ ràng, nhất quán, khả năng kiểm tra và giới hạn được ứng viên trình bày.
    evaluation_signals:
      - Mô tả kỹ thuật mạch lạc và nhất quán.
      - Có repository, tài liệu API hoặc chi tiết có thể kiểm tra.
      - Phân biệt rõ đóng góp cá nhân và giới hạn vận hành.
    missing_evidence_handling: Thông tin khó kiểm tra làm giảm điểm tiêu chí này nhưng không tự tạo unsatisfied.
critical_requirement_ids: [be-python, be-rest-api, be-relational-data, be-testing, be-delivery-workflow]
