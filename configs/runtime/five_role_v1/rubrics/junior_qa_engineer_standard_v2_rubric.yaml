artifact_kind: scoring_rubric
rubric_id: qa-std-rubric-v2
rubric_version: 2.0.1
contract_status: approved_for_runtime
job_profile_id: junior-qa-engineer-std-v2
score_scale: {minimum: 0, maximum: 100}
criteria:
  - criterion_id: mandatory-requirements
    title: Yêu cầu bắt buộc
    weight: 30
    description: Đối chiếu riêng từng yêu cầu bắt buộc và phân biệt đạt, không đạt, thiếu và mâu thuẫn.
    evaluation_signals:
      - Thông tin thực hành trực tiếp cho từng yêu cầu bắt buộc.
      - Phân biệt satisfied, unsatisfied, missing và conflicting.
      - Không dùng một hoạt động testing để suy diễn tất cả năng lực còn lại.
    missing_evidence_handling: Thiếu hoặc mâu thuẫn ở bất kỳ yêu cầu bắt buộc nào phải kích hoạt Needs Review.
  - criterion_id: qa-technical-specialization
    title: Năng lực kỹ thuật chuyên môn
    weight: 25
    description: Đánh giá STLC, thiết kế test, API, SQL, automation và khả năng duy trì regression suite.
    evaluation_signals:
      - Áp dụng kỹ thuật thiết kế test từ acceptance criteria.
      - Test API và SQL có positive, negative và đối soát dữ liệu.
      - Automation có assertion, fixture và cách chạy lặp lại.
    missing_evidence_handling: Không suy diễn test coverage chỉ từ tên công cụ.
  - criterion_id: qa-role-capability
    title: Năng lực theo vai trò
    weight: 20
    description: Đánh giá phân tích requirement, risk-based coverage, defect lifecycle và xác nhận bản sửa.
    evaluation_signals:
      - Phạm vi và mức ưu tiên kiểm thử dựa trên rủi ro.
      - Bug report có expected, actual, môi trường và severity.
      - Có regression và xác nhận bản sửa trong phạm vi cụ thể.
    missing_evidence_handling: Không tự bổ sung coverage hoặc chất lượng sản phẩm chưa được nêu.
  - criterion_id: projects-and-impact
    title: Dự án, thực tập và tác động
    weight: 15
    description: Đánh giá phạm vi đóng góp, khả năng tái tạo đầu ra và tác động phù hợp cấp junior.
    evaluation_signals:
      - Vai trò và phạm vi kiểm thử được nêu rõ.
      - Có test plan, collection, automation suite hoặc bug report kiểm tra được.
      - Tác động phù hợp với thông tin về defect hoặc coverage.
    missing_evidence_handling: Không bịa số lỗi hoặc tác động chưa được xác nhận.
  - criterion_id: communication-and-evidence-quality
    title: Độ rõ ràng và khả năng kiểm tra của thông tin trong CV
    weight: 10
    description: Đánh giá mức rõ ràng, nhất quán, khả năng kiểm tra và giới hạn được ứng viên trình bày.
    evaluation_signals:
      - Test evidence và bug report được mô tả mạch lạc.
      - Có artifact hoặc chi tiết có thể kiểm tra.
      - Nêu rõ phạm vi chưa kiểm thử và giới hạn môi trường.
    missing_evidence_handling: Thông tin khó kiểm tra làm giảm điểm tiêu chí này nhưng không tự tạo unsatisfied.
critical_requirement_ids: [qa-testing-foundations, qa-test-cases, qa-api-testing, qa-data-check, qa-automation-foundation]
